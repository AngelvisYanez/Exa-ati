name: exa-ati-test

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Configura NEXT_PUBLIC_APP_URL}
    image: exa-ati:${EXA_ATI_IMAGE_TAG:?Configura el SHA publicado}
    container_name: exa-ati-test-app
    env_file:
      - .env.plesk-test
    environment:
      NODE_ENV: production
      HEADLESS: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${EXA_ATI_TEST_PORT:-3101}:3001"
    volumes:
      - test_downloads:/app/downloads
      - test_browser_session:/app/browser_session
      - test_logs:/app/logs
      - test_tmp:/app/tmp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  test_downloads:
  test_browser_session:
  test_logs:
  test_tmp:
