# Despliegue automático a producción Plesk en push a main.
# Variables protected: PLESK_SSH_HOST, PLESK_SSH_USER, PLESK_SSH_PRIVATE_KEY
# Opcional: PLESK_SSH_PORT (default 22)
# Ver docs/DESPLIEGUE_PRODUCCION.md

stages:
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"

deploy_production:
  stage: deploy
  image: alpine:3.20
  resource_group: exa-ati-production
  timeout: 120 minutes
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -z "${PLESK_SSH_HOST:-}" ] || [ -z "${PLESK_SSH_USER:-}" ] || [ -z "${PLESK_SSH_PRIVATE_KEY:-}" ]; then
        echo "Faltan variables PLESK_SSH_HOST, PLESK_SSH_USER o PLESK_SSH_PRIVATE_KEY." >&2
        exit 1
      fi
    - printf '%s\n' "$PLESK_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -p "${PLESK_SSH_PORT:-22}" -H "$PLESK_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      set -euo pipefail
      PORT="${PLESK_SSH_PORT:-22}"
      echo "Deploy EXA-ATI sha=${CI_COMMIT_SHA}"
      ssh -i ~/.ssh/id_deploy \
        -p "$PORT" \
        -o IdentitiesOnly=yes \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=yes \
        "${PLESK_SSH_USER}@${PLESK_SSH_HOST}" \
        "/opt/exa-ati/bin/from-gitlab.sh ${CI_COMMIT_SHA}"
  after_script:
    - rm -f ~/.ssh/id_deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
